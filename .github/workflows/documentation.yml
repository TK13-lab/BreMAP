name: Package and documentation
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package and documentation dependencies
        run: python -m pip install ".[plot]" -r docs/user/requirements.txt
      - name: Test input guards and plotting APIs
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -p 'test_bremap_usability.py'
      - name: Test teacher cache integrity without upstream models
        run: python -m unittest discover -s tests -p 'test_teacher_encoder.py'
      - name: Test checkpoint selection, consent and cache integrity offline
        run: python -m unittest discover -s tests -p 'test_checkpoint_downloads.py'
      - name: Exercise installed package and reusable reference
        run: python -I docs/user/examples/quickstart.py --out "$RUNNER_TEMP/bremap-quickstart"
      - name: Check tutorial mapping output
        run: python -I docs/user/examples/check_mapping.py "$RUNNER_TEMP/bremap-quickstart/workflow/mapping"
      - name: Execute the step-by-step tutorial
        run: |
          mkdir "$RUNNER_TEMP/bremap-tutorial"
          cp docs/user/examples/data/*.csv "$RUNNER_TEMP/bremap-tutorial/"
          cd "$RUNNER_TEMP/bremap-tutorial"
          python -I "$GITHUB_WORKSPACE/docs/user/examples/tutorial.py"
      - name: Build documentation with warnings treated as errors
        run: python -m sphinx -W --keep-going -b html docs/user outputs/documentation/html
  student:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install CPU student dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install .
      - name: Check student portability, validation and task decisions
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: python -m unittest discover -s tests -p 'test_student_encoder.py'
