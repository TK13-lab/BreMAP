# Paths assume this package is the root of its standalone public repository.
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
sphinx:
  configuration: docs/user/conf.py
  fail_on_warning: true
python:
  install:
    - requirements: docs/user/requirements.txt
    - method: pip
      path: .
